[package]
name = "clavis"
version = "0.4.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/megara-arevaco/clavis"
description = "A compact native terminal reference with a system tray"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
rdev = "0.5"
evdev = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = "0.2.2"

[profile.release]
lto = "thin"
strip = true
