[package]
name = "clavis"
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/megara-arevaco/clavis"
description = "A compact native terminal reference with a system tray"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
ksni = "0.2.2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true
