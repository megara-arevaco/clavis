name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify package version matches tag
        run: |
          VERSION=$(awk -F '"' '/^version =/{print $2; exit}' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libx11-dev libxi-dev libxtst-dev libdbus-1-dev dpkg-dev
      - name: Test and build distribution
        run: ./build-dist.sh
      - name: Publish unsigned executables and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --generate-notes --title "Clavis $GITHUB_REF_NAME"
